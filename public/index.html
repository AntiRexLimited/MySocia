<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySocia AI Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 700px; margin: 40px auto; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; }
        .panel { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; background: #238636; color: white; cursor: pointer; }
        button:hover { background: #2ea043; }
        button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        #logs { height: 350px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
        .user { color: #79c0ff; margin-bottom: 8px; }
        .agent { color: #7ee787; margin-bottom: 8px; }
        .system { color: #8b949e; margin-bottom: 8px; font-style: italic; }
    </style>
</head>
<body>
    <h1>MySocia Voice Assistant</h1>
    
    <div class="panel">
        <h3 style="margin-top: 0;">WhatsApp Status: <span id="wa-status" style="color: #e3b341;">Initializing...</span></h3>
        <img id="wa-qr" style="display: none; width: 250px; height: 250px; border-radius: 8px;" alt="WhatsApp QR Code" />
    </div>

    <div class="panel">
        <button id="startBtn">Connect Microphone</button>
        <div id="logs"><div class="system">Waiting for microphone...</div></div>
    </div>

    <script>
        let audioContext;
        let nextPlayTime = 0;
        const playbackJitterBufferSeconds = 0.15;
        const activeAudioSources = new Set();
        const transcriptEntries = new Map();
        let agentReady = false;
        let agentError = null;
        const readinessWaiters = new Set();

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        ws.onopen = () => log('Connected to Node backend.', 'system');
        ws.onerror = () => log('Backend WebSocket connection failed.', 'system');
        ws.onclose = () => {
            agentReady = false;
            rejectReadinessWaiters(new Error('Backend connection closed.'));
            log('Backend connection closed.', 'system');
        };

        ws.onmessage = (event) => {
            if (typeof event.data !== 'string') return;
            const msg = JSON.parse(event.data);

            if (msg.type === 'whatsapp.status') {
                const statusText = document.getElementById('wa-status');
                const qrImg = document.getElementById('wa-qr');
                if (msg.data.status === 'qr') {
                    statusText.textContent = 'Scan QR Code';
                    statusText.style.color = '#e3b341';
                    qrImg.src = msg.data.qrImage;
                    qrImg.style.display = 'block';
                } else if (msg.data.status === 'connected') {
                    statusText.textContent = 'Connected';
                    statusText.style.color = '#3fb950';
                    qrImg.style.display = 'none';
                } else if (msg.data.status === 'disconnected') {
                    statusText.textContent = 'Disconnected';
                    statusText.style.color = '#f85149';
                }
            } else if (msg.type === 'session.ready') {
                agentReady = true;
                agentError = null;
                resolveReadinessWaiters();
                log('Voice agent ready.', 'system');
            } else if (msg.type === 'session.error') {
                agentReady = false;
                agentError = msg.message || 'Voice agent session failed.';
                rejectReadinessWaiters(new Error(agentError));
                log(`Voice agent error: ${agentError}`, 'system');
            } else if (msg.type === 'session.ended') {
                agentReady = false;
                log('Voice agent session ended.', 'system');
            } else if (msg.type === 'transcript.user.delta') {
                updateTranscript(`user:${msg.item_id}`, `You: "${msg.text}`, 'user');
            } else if (msg.type === 'transcript.user') {
                updateTranscript(`user:${msg.item_id}`, `You: "${msg.text}"`, 'user');
            } else if (msg.type === 'transcript.agent.delta') {
                const entryKey = `agent:${msg.reply_id}`;
                const currentText = transcriptEntries.get(entryKey)?.textContent || 'Agent: "';
                updateTranscript(entryKey, `${appendTranscriptDelta(currentText, msg.delta)}`, 'agent');
            } else if (msg.type === 'transcript.agent') {
                updateTranscript(`agent:${msg.reply_id}`, `Agent: "${msg.text}"`, 'agent');
            } else if (msg.type === 'reply.audio' && msg.data) {
                playAudio(msg.data);
            } else if (msg.type === 'reply.done' && msg.status === 'interrupted') {
                stopPlayback();
            }
        };

        document.getElementById('startBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            let micStream;
            btn.disabled = true;
            btn.textContent = 'Requesting microphone...';

            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1
                    }
                });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await audioContext.resume();
                await audioContext.audioWorklet.addModule('pcm-processor.js');
                await waitForAgentReady();

                const source = audioContext.createMediaStreamSource(micStream);
                const processor = new AudioWorkletNode(audioContext, 'pcm16-resampler', {
                    processorOptions: { targetSampleRate: 24000 }
                });
                processor.port.onmessage = ({ data }) => {
                    if (agentReady && ws.readyState === WebSocket.OPEN) ws.send(data);
                };
                source.connect(processor);
                processor.connect(audioContext.destination);

                nextPlayTime = audioContext.currentTime;
                btn.textContent = 'Listening...';
                log(`Microphone active (${audioContext.sampleRate} Hz input; resampled to 24 kHz).`, 'system');
            } catch (err) {
                micStream?.getTracks().forEach((track) => track.stop());
                if (audioContext && audioContext.state !== 'closed') await audioContext.close();
                audioContext = null;
                log(`Microphone setup failed: ${err.message}`, 'system');
                btn.disabled = false;
                btn.textContent = 'Connect Microphone';
            }
        });

        function waitForAgentReady() {
            if (agentReady) return Promise.resolve();
            if (agentError) return Promise.reject(new Error(agentError));

            return new Promise((resolve, reject) => {
                let timeout;
                const waiter = {
                    resolve: () => {
                        clearTimeout(timeout);
                        readinessWaiters.delete(waiter);
                        resolve();
                    },
                    reject: (error) => {
                        clearTimeout(timeout);
                        readinessWaiters.delete(waiter);
                        reject(error);
                    }
                };
                timeout = setTimeout(() => waiter.reject(new Error('Timed out waiting for the voice agent.')), 15000);
                readinessWaiters.add(waiter);
            });
        }

        function resolveReadinessWaiters() {
            readinessWaiters.forEach((waiter) => waiter.resolve());
        }

        function rejectReadinessWaiters(error) {
            readinessWaiters.forEach((waiter) => waiter.reject(error));
        }

        function playAudio(base64Audio) {
            if (!audioContext) return;
            const binary = window.atob(base64Audio);
            const view = new DataView(Uint8Array.from(binary, (char) => char.charCodeAt(0)).buffer);
            const sampleCount = Math.floor(view.byteLength / 2);
            const samples = new Float32Array(sampleCount);
            for (let i = 0; i < sampleCount; i++) samples[i] = view.getInt16(i * 2, true) / 32768;

            const audioBuffer = audioContext.createBuffer(1, sampleCount, 24000);
            audioBuffer.getChannelData(0).set(samples);
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            activeAudioSources.add(source);
            source.onended = () => {
                activeAudioSources.delete(source);
                source.disconnect();
            };

            nextPlayTime = Math.max(
                nextPlayTime,
                audioContext.currentTime + playbackJitterBufferSeconds
            );
            source.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
        }

        function stopPlayback() {
            for (const source of activeAudioSources) {
                source.stop();
                source.disconnect();
            }
            activeAudioSources.clear();
            if (audioContext) nextPlayTime = audioContext.currentTime + playbackJitterBufferSeconds;
        }

        function updateTranscript(key, text, className) {
            let entry = transcriptEntries.get(key);
            if (!entry) {
                entry = document.createElement('div');
                entry.className = className;
                transcriptEntries.set(key, entry);
                document.getElementById('logs').appendChild(entry);
            }
            entry.textContent = text;
            const logs = document.getElementById('logs');
            logs.scrollTop = logs.scrollHeight;
        }

        function appendTranscriptDelta(current, delta) {
            if (!current || !delta) return current + delta;
            if (current === 'Agent: "') return current + delta;
            if (/^\s/.test(delta) || /\s$/.test(current) || /^[,.;:!?%…)}\]]/.test(delta)) {
                return current + delta;
            }
            return `${current} ${delta}`;
        }

        function log(text, className = '') {
            const entry = document.createElement('div');
            entry.className = className;
            entry.textContent = text;
            const logs = document.getElementById('logs');
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
